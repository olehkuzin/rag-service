services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      RAG_CORPUS_DIR: /app/data/corpus
      RAG_INDEX_DIR: /app/data/index
      RAG_VECTOR_STORE: local
      RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-mistral}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-mistral-embed}
      RAG_EMBEDDING_DIM: ${RAG_EMBEDDING_DIM:-1024}
      RAG_LLM_PROVIDER: ${RAG_LLM_PROVIDER:-mistral}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-mistral-large-latest}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:?set MISTRAL_API_KEY in .env}
    volumes:
      - ./data/corpus:/app/data/corpus:ro
      - index:/app/data/index
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  index:
