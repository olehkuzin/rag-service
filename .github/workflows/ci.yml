name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # a project venv, like `make install`: the runner's system Python is
      # externally managed, so `uv pip install --system` is not an option
      - name: Install dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv -e ".[dev]"

      - name: Lint (ruff)
        run: .venv/bin/ruff check .

      - name: Format check (ruff)
        run: .venv/bin/ruff format --check .

      - name: Type check (mypy)
        run: .venv/bin/mypy app eval scripts

      - name: Tests
        run: .venv/bin/pytest -q --cov=app --cov-report=term-missing

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t rag-service:${{ github.sha }} .
