name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # the cache is keyed on the lockfile, so it is invalidated exactly
          # when the resolved dependency set changes
          cache-dependency-glob: uv.lock

      # install the exact versions pinned in uv.lock into the project venv
      # (.venv, like `make install`); --locked fails if uv.lock is out of date
      # with pyproject.toml instead of silently re-resolving
      - name: Install dependencies
        run: uv sync --locked --extra dev --python 3.12

      - name: Lint (ruff)
        run: .venv/bin/ruff check .

      - name: Format check (ruff)
        run: .venv/bin/ruff format --check .

      - name: Type check (mypy)
        run: .venv/bin/mypy app eval scripts

      - name: Tests
        run: .venv/bin/pytest -q --cov=app --cov-report=term-missing

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t rag-service:${{ github.sha }} .
